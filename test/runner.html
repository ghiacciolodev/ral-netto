<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test - calcolatore RAL netto 2026</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    padding: 2rem 1.25rem 4rem;
    background: #14161a;
    color: #e8e6e1;
    font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  main { max-width: 60rem; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0 0 1.25rem; letter-spacing: -0.01em; }
  .verdict { padding: 0.75rem 1rem; border-radius: 6px; font-weight: 600; margin-bottom: 1.5rem; }
  .verdict.pass { background: #17351f; color: #7ee2a0; }
  .verdict.fail { background: #3a1a1a; color: #ff9b8a; }
  h2 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: #8d8a83; margin: 1.75rem 0 0.5rem; font-weight: 600;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 0.2rem 0; display: flex; gap: 0.6rem; align-items: baseline; }
  .mark { flex: none; width: 1.1rem; font-weight: 700; }
  .ok .mark { color: #5fbe7f; }
  .no .mark { color: #ff6b52; }
  .no { color: #ff9b8a; }
  .detail { color: #8d8a83; }
</style>
</head>
<body>
<main>
  <h1>Test del motore di calcolo, anno d'imposta 2026</h1>
  <div id="verdict" class="verdict">Esecuzione in corso...</div>
  <div id="results"></div>
</main>

<script src="../src/parameters-2025.js"></script>
<script src="../src/parameters-2026.js"></script>
<script src="../src/local-2025.js"></script>
<script src="../src/local-2026.js"></script>
<script src="../src/parameters.js"></script>
<script src="../src/engine/numbers.js"></script>
<script src="../src/engine/position.js"></script>
<script src="../src/engine/steps.js"></script>
<script src="../src/engine/rules.js"></script>
<script src="../src/engine/calculation.js"></script>
<script src="../src/engine/breakpoints.js"></script>
<script src="../src/engine/inverse.js"></script>
<script src="../src/engine.js"></script>
<script src="harness.js"></script>
<script src="fixtures.js"></script>
<script src="suites/numbers.js"></script>
<script src="suites/validation.js"></script>
<script src="suites/values.js"></script>
<script src="suites/partial-year.js"></script>
<script src="suites/family.js"></script>
<script src="suites/local.js"></script>
<script src="suites/years.js"></script>
<script src="suites/ledger.js"></script>
<script src="suites/breakpoints.js"></script>
<script src="suites/shape.js"></script>
<script src="suites/inverse.js"></script>
<script src="cases.js"></script>
<script>
(function () {
  'use strict';

  var engine = createEngine(PARAMETERS);
  var summary = CASES.runTests(engine, createHarness(), PARAMETERS, createEngine);

  var verdict = document.getElementById('verdict');
  verdict.className = 'verdict ' + (summary.failed === 0 ? 'pass' : 'fail');
  verdict.textContent = summary.failed === 0
    ? summary.passed + ' test superati su ' + summary.total
    : summary.failed + ' test falliti su ' + summary.total;

  var container = document.getElementById('results');
  var lastGroup = null;
  var list = null;

  summary.results.forEach(function (r) {
    if (r.group !== lastGroup) {
      lastGroup = r.group;
      var heading = document.createElement('h2');
      heading.textContent = r.group;
      container.appendChild(heading);
      list = document.createElement('ul');
      container.appendChild(list);
    }

    var item = document.createElement('li');
    item.className = r.passed ? 'ok' : 'no';

    var mark = document.createElement('span');
    mark.className = 'mark';
    mark.textContent = r.passed ? '✓' : '✗';
    item.appendChild(mark);

    var text = document.createElement('span');
    text.textContent = r.name;
    if (!r.passed && r.detail) {
      var detail = document.createElement('span');
      detail.className = 'detail';
      detail.textContent = '  ' + r.detail;
      text.appendChild(detail);
    }
    item.appendChild(text);

    list.appendChild(item);
  });
})();
</script>
</body>
</html>
